# config/services.yaml
services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $telegramLogger: '@monolog.logger.telegram'
            $ffmpegLogger: '@monolog.logger.ffmpeg'
            $debug: '%kernel.debug%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Message/'
            # built per-bot by TelegramClientFactory, not a container service
            - '../src/Service/Telegram/TelegramService.php'

    App\Service\Telegram\VoiceSender:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    App\Service\Admin\SampleService:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    App\Command\ImportAudioCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
